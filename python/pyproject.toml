[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epwforge-mcp"
version = "0.1.6"
description = "MCP server for EPWForge — let Claude and other AI agents generate climate-stressed weather files (EPW, DDY) for any global location. Custom TMYx / AMY synthesis from ERA5, CMIP6 future-climate morphing (4 SSPs, 7 percentiles, 21-model ensemble), urban heat island presets, extreme-event injection (heat waves, cold snaps, humidity & wind compound events with per-event intensity), and wildfire smoke overlays. For EnergyPlus, OpenStudio, IES VE, eQUEST and any EPW-consuming workflow."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Guzzlabs", email = "tuna@guzzlabs.com" }
]
dependencies = [
    "mcp>=1.2.0",
    "httpx[http2]>=0.27.0",
    "pydantic>=2.0",
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "claude",
    "ai-agent",
    "epw",
    "ddy",
    "weather-file",
    "custom-weather-file",
    "energyplus",
    "openstudio",
    "ies-ve",
    "equest",
    "tmy",
    "tmyx",
    "amy",
    "weather-morphing",
    "climate-deltas",
    "future-weather",
    "cmip6",
    "ssp",
    "era5",
    "ashrae-design-day",
    "building-energy-simulation",
    "building-energy-modeling",
    "energy-modeling",
    "climate-adaptation",
    "climate-resilience",
    "extreme-events",
    "heat-wave",
    "cold-snap",
    "compound-events",
    "urban-heat-island",
    "uhi",
    "wildfire-smoke",
    "epwforge",
    "guzzlabs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://epwforge.com"
Repository = "https://github.com/guzz-labs/epwforge-mcp"
Issues = "https://github.com/guzz-labs/epwforge-mcp/issues"

[project.scripts]
epwforge-mcp = "epwforge_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epwforge_mcp"]
